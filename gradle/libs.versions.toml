[versions]
activityCompose = "1.8.2"
activityKtx = "1.8.2"
androidx-core = "1.5.0"
androidx-junit = "1.1.5"
appwidgetHost = "0.2.2"
appwidgetViewer = "0.2.2"
composeBom = "2024.02.00"
composesnapshot = "-" # a single character = no snapshot
constraintlayout = "2.1.4"
core = "1.0.6"
coreKtx = "1.12.0"
coreRemoteviews = "1.0.0"
espressoCore = "3.5.1"
firebaseBom = "32.7.2"
glance = "1.1.0"
glance-preview = "1.1.0"
gradlePlugins-agp = "8.5.0"
gradlePlugins-crashlytics = "2.9.9"
gradlePlugins-gms = "4.4.1"
gradlePlugins-ksp = "1.9.22-1.0.17"
gson = "2.10"
harmony = "1.2.2"
junit = "4.13.2"
kotlin = "1.9.22"
kotlinxCoroutinesAndroid = "1.7.1"
kotlinxSerializationJson = "1.3.3"
material = "1.11.0"
moshi = "1.15.1"
navigationUiKtx = "2.7.7"
okhttp = "4.12.0"
runner = "1.5.2"
uiautomator = "2.2.0"
vectordrawable = "1.1.0"
workRuntimeKtx = "2.9.0"

[libraries]
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-remoteviews = { module = "androidx.core:core-remoteviews", version.ref = "coreRemoteviews" }
androidx-core-testing = { module = "androidx.test:core", version.ref = "androidx-core" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-lifecycle = { module = "androidx.lifecycle:lifecycle-viewmodel-compose" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigationUiKtx" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigationUiKtx" }
androidx-runner = { module = "androidx.test:runner", version.ref = "runner" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-vectordrawable = { module = "androidx.vectordrawable:vectordrawable", version.ref = "vectordrawable" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
appwidget-host = { module = "com.google.android.glance.tools:appwidget-host", version.ref = "appwidgetHost" }
appwidget-viewer = { module = "com.google.android.glance.tools:appwidget-viewer", version.ref = "appwidgetViewer" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-foundationLayout = { module = "androidx.compose.foundation:foundation-layout" }
compose-material = { module = "androidx.compose.material:material" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-windowSizeClass = { module = "androidx.compose.material3:material3-window-size-class" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-toolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
# This dependency needs Jetifier, when removed Jetifier can be disabled
core = { module = "com.github.kizitonwose.colorpreference:core", version.ref = "core" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
glance-preview = { module = "androidx.glance:glance-preview", version.ref = "glance-preview" }
glance-appwidget-preview = { module = "androidx.glance:glance-appwidget-preview", version.ref = "glance-preview" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
harmony = { module = "com.frybits.harmony:harmony", version.ref = "harmony" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
material = { module = "com.google.android.material:material", version.ref = "material" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-ksp = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[bundles]
androidx = [
    "androidx-activity-ktx",
    "androidx-activity-compose",
    "androidx-constraintlayout",
    "androidx-core-ktx",
    "androidx-core-remoteviews",
    "androidx-core-testing",
    "androidx-espresso-core",
    "androidx-junit",
    "androidx-lifecycle",
    "androidx-navigation-fragment-ktx",
    "androidx-navigation-ui-ktx",
    "androidx-runner",
    "androidx-uiautomator",
    "androidx-vectordrawable",
    "androidx-work-runtime-ktx"
]
glance = [
    "glance-appwidget",
    "glance-material3",
    # For debugging
    "glance-preview",
    "glance-appwidget-preview"
]
compose = [
    "compose-foundation",
    "compose-foundationLayout",
    "compose-material",
    "compose-material3",
    "compose-material3-windowSizeClass",
    "compose-ui",
]
composeTooling = [
    "compose-ui-tooling",
    "compose-ui-toolingPreview"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
android-library = { id = "com.android.library", version.ref = "gradlePlugins-agp" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "gradlePlugins-crashlytics" }
googleServices = { id = "com.google.gms.google-services", version.ref = "gradlePlugins-gms" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "gradlePlugins-ksp" }
